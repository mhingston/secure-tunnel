# Template only. Replace every REPLACE_WITH_* value before deployment.

[listen]
# Bind a private interface, firewall this port to known clients, and do not use
# 0.0.0.0 unless the deployment has an explicit network-control decision.
address = "REPLACE_WITH_PRIVATE_INTERFACE:8443"

# Optional TLS 1.3 defence in depth. Noise IK remains mandatory inside TLS.
[outer_tls]
enabled = false
# certificate_file = "/Library/Application Support/SecureTunnel/tls-cert.pem"
# private_key_file = "/Library/Application Support/SecureTunnel/tls-key.pem"

# The tunnel ingress is destination-restricted: it can connect only to one
# operator-chosen service on the remote host's loopback interface. The service
# may be an application service, a dedicated forward proxy, or another trusted
# TCP service. Destination selection is never client-driven.
[destination]
address = "127.0.0.1:9000"
# Example for a separately managed forward proxy:
# address = "127.0.0.1:3128"

[identity]
private_key_file = "/Library/Application Support/SecureTunnel/server.key"
# Bounded overlap for server-key rotation (maximum eight total identities).
# additional_private_key_files = ["/Library/Application Support/SecureTunnel/server-previous.key"]

[[authorized_clients]]
name = "REPLACE_WITH_CLIENT_NAME"
public_key = "<REPLACE_WITH_BASE64_CLIENT_PUBLIC_KEY>"

[limits]
max_connections = 32
max_plaintext_record_bytes = 16384
